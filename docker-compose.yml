version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-api-service
    ports:
      - "8011:8080"
    environment:
      - PORT=8080
      - BASEURL=http://localhost
      - CORS=http://127.0.0.1:3000,http://localhost:8088,https://portfolio.imnon.xyz,http://localhost:8081,https://profile.imnon.xyz,https://portfolio.nknk.site,https://profile.nknk.site,https://aboutnon.in.th
    restart: unless-stopped
